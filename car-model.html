<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D 汽车模型 - 精细版</title>
<style>
  body { margin: 0; overflow: hidden; font-family: "Microsoft YaHei", sans-serif; background: #101018; }
  #info {
    position: absolute; top: 16px; left: 50%; transform: translateX(-50%);
    color: #fff; background: rgba(0,0,0,0.55); padding: 10px 26px;
    border-radius: 30px; font-size: 14px; pointer-events: none; white-space: nowrap;
  }
  #controls {
    position: absolute; bottom: 18px; left: 50%; transform: translateX(-50%);
    display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; max-width: 95vw;
  }
  button {
    background: rgba(255,255,255,0.12); color: #fff; border: 1px solid rgba(255,255,255,0.25);
    padding: 9px 18px; border-radius: 25px; font-size: 13px; cursor: pointer;
    transition: 0.2s; backdrop-filter: blur(6px);
  }
  button:hover { background: rgba(255,255,255,0.28); transform: translateY(-2px); }
  button.active { background: #e63946; border-color: #e63946; }
  .color-dot { display:inline-block; width:12px; height:12px; border-radius:50%; margin-right:6px; vertical-align:middle; }
</style>
</head>
<body>
<div id="info">🚗 3D 跑车 — 拖拽旋转 | 滚轮缩放 | 右键平移</div>
<div id="controls">
  <button onclick="setColor(0xe63946)"><span class="color-dot" style="background:#e63946"></span>红</button>
  <button onclick="setColor(0x1d3557)"><span class="color-dot" style="background:#1d3557"></span>蓝</button>
  <button onclick="setColor(0x2a9d8f)"><span class="color-dot" style="background:#2a9d8f"></span>绿</button>
  <button onclick="setColor(0xf4a261)"><span class="color-dot" style="background:#f4a261"></span>橙</button>
  <button onclick="setColor(0xffffff)"><span class="color-dot" style="background:#fff"></span>白</button>
  <button onclick="toggleSpin()">🔄 视角旋转</button>
  <button id="btnDrive" class="active" onclick="toggleDrive()">⏸ 停止行驶</button>
  <button onclick="toggleDoors()">🚪 开关车门</button>
  <button onclick="toggleLights()">💡 前照灯</button>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

// ================= 场景 =================
const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x101018, 35, 90);

const camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.1, 300);
camera.position.set(10, 5.5, 12);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.9, 0);
controls.enableDamping = true;
controls.maxPolarAngle = Math.PI / 2.05;
controls.minDistance = 6;
controls.maxDistance = 30;

// ================= 灯光 =================
scene.add(new THREE.AmbientLight(0x8899bb, 0.9));
scene.add(new THREE.HemisphereLight(0xffffff, 0x333344, 1.1));

const sun = new THREE.DirectionalLight(0xffffff, 2.6);
sun.position.set(12, 18, 10);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.near = 0.5;
sun.shadow.camera.far = 70;
sun.shadow.camera.left = -20;
sun.shadow.camera.right = 20;
sun.shadow.camera.top = 20;
sun.shadow.camera.bottom = -20;
sun.shadow.bias = -0.0004;
scene.add(sun);

// ================= 地面 =================
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(120, 120),
  new THREE.MeshStandardMaterial({ color: 0x1b1b26, roughness: 0.75, metalness: 0.25 })
);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

const grid = new THREE.GridHelper(120, 80, 0x3a3a52, 0x262636);
grid.position.y = 0.01;
scene.add(grid);

// 环境反射
const pmrem = new THREE.PMREMGenerator(renderer);
const envScene = new THREE.Scene();
envScene.background = new THREE.Color(0x334455);
scene.environment = pmrem.fromScene(envScene, 0.05).texture;

// ================= 材质 =================
let bodyMat = new THREE.MeshStandardMaterial({ color: 0xe63946, roughness: 0.22, metalness: 0.8, envMapIntensity: 1.4 });
const darkMat   = new THREE.MeshStandardMaterial({ color: 0x141414, roughness: 0.5,  metalness: 0.4 });
const glassMat  = new THREE.MeshStandardMaterial({ color: 0x16222e, roughness: 0.05, metalness: 0.85 });
const chromeMat = new THREE.MeshStandardMaterial({ color: 0xd8d8d8, roughness: 0.12, metalness: 1.0 });
const tireMat   = new THREE.MeshStandardMaterial({ color: 0x151515, roughness: 0.92, metalness: 0.0 });
const rimMat    = new THREE.MeshStandardMaterial({ color: 0xb8b8b8, roughness: 0.28, metalness: 0.95 });
const carbonMat = new THREE.MeshStandardMaterial({ color: 0x0c0c0c, roughness: 0.6, metalness: 0.5 });

const headlightMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.2, metalness: 0.1, emissive: 0xccddff, emissiveIntensity: 2.2 });
const tailMat = new THREE.MeshStandardMaterial({ color: 0x330000, roughness: 0.3, metalness: 0.2, emissive: 0xff1111, emissiveIntensity: 1.6 });

function box(w, h, d, mat, x, y, z, rx = 0, ry = 0, rz = 0) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
  m.position.set(x, y, z);
  m.rotation.set(rx, ry, rz);
  m.castShadow = true;
  m.receiveShadow = true;
  return m;
}
function rbox(w, h, d, r, mat, x, y, z, rx = 0, ry = 0, rz = 0) {
  const m = new THREE.Mesh(new RoundedBoxGeometry(w, h, d, 4, r), mat);
  m.position.set(x, y, z);
  m.rotation.set(rx, ry, rz);
  m.castShadow = true;
  m.receiveShadow = true;
  return m;
}

// ================= 汽车 =================
const car = new THREE.Group();
car.rotation.order = 'YXZ';
const refs = { doorsL: [], doorsR: [], wheels: [], steerL: null, steerR: null, exhausts: [] };

// ---- 主体 ----
car.add(rbox(3.9, 0.78, 7.6, 0.3, bodyMat, 0, 0.88, 0));                       // 车身下部
car.add(rbox(3.0, 0.95, 3.7, 0.35, bodyMat, 0, 1.55, -0.55, 0.04));           // 座舱
car.add(rbox(3.65, 0.14, 2.3, 0.06, bodyMat, 0, 1.28, 2.5, -0.07));           // 引擎盖
car.add(rbox(3.6, 0.14, 1.7, 0.06, bodyMat, 0, 1.22, -3.05, 0.05));           // 后备箱盖
car.add(rbox(3.95, 0.55, 0.7, 0.16, darkMat, 0, 0.58, 4.05));                 // 前保险杠
car.add(rbox(3.95, 0.55, 0.7, 0.16, darkMat, 0, 0.58, -4.05));                // 后保险杠

// 前唇 / 后扩散器
car.add(box(3.7, 0.12, 0.5, carbonMat, 0, 0.28, 4.1));
const diffuser = box(3.2, 0.1, 0.5, carbonMat, 0, 0.32, -4.1);
diffuser.rotation.x = -0.3;
car.add(diffuser);

// 侧裙
car.add(box(3.95, 0.12, 0.3, darkMat, 1.96, 0.3, -0.3));
car.add(box(3.95, 0.12, 0.3, darkMat, -1.96, 0.3, -0.3));

// ---- 玻璃 ----
car.add(box(2.85, 1.55, 0.05, glassMat, 0, 1.62, 1.62, -0.62));   // 前挡风
car.add(box(2.8, 1.4, 0.05, glassMat, 0, 1.55, -2.45, 0.55));     // 后挡风
car.add(box(0.06, 0.62, 2.2, glassMat, 1.53, 1.55, -0.5, 0, 0, 0.06));   // 右窗
car.add(box(0.06, 0.62, 2.2, glassMat, -1.53, 1.55, -0.5, 0, 0, -0.06)); // 左窗
car.add(box(0.06, 0.55, 1.2, glassMat, 1.53, 1.55, 1.05, 0, 0, 0.08));   // 右三角窗
car.add(box(0.06, 0.55, 1.2, glassMat, -1.53, 1.55, 1.05, 0, 0, -0.08)); // 左三角窗
car.add(box(1.7, 0.04, 1.7, glassMat, 0, 2.03, -0.55));           // 天窗

// 车窗支柱
car.add(box(0.08, 0.6, 0.1, bodyMat, 1.5, 1.58, 0.35));
car.add(box(0.08, 0.6, 0.1, bodyMat, -1.5, 1.58, 0.35));

// ---- 车头细节 ----
// 前格栅
car.add(box(2.5, 0.5, 0.1, darkMat, 0, 0.78, 4.12));
for (let i = -2; i <= 2; i++) {
  car.add(box(2.35, 0.025, 0.06, chromeMat, 0, 0.78 + i * 0.09, 4.2));
}
// 主大灯（贯穿式日行灯带）
car.add(box(3.1, 0.14, 0.06, headlightMat, 0, 1.06, 4.12));
// 双透镜大灯
for (const sx of [-1.35, 1.35]) {
  const lens = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.22, 0.12, 24), headlightMat);
  lens.rotation.x = Math.PI / 2;
  lens.position.set(sx, 1.06, 4.16);
  car.add(lens);
}
// 雾灯
for (const sx of [-1.4, 1.4]) {
  const fog = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.1, 0.06, 16), headlightMat);
  fog.rotation.x = Math.PI / 2;
  fog.position.set(sx, 0.42, 4.1);
  car.add(fog);
}
// 尾灯（贯穿式）
car.add(box(3.2, 0.16, 0.06, tailMat, 0, 1.06, -4.12));

// ---- 排气管 ----
for (const sx of [-0.7, 0.7]) {
  const tip = new THREE.Mesh(new THREE.CylinderGeometry(0.09, 0.12, 0.3, 20), chromeMat);
  tip.rotation.x = Math.PI / 2;
  tip.position.set(sx, 0.34, -4.4);
  car.add(tip);
  const inner = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.06, 0.32, 16), darkMat);
  inner.rotation.x = Math.PI / 2;
  inner.position.set(sx, 0.34, -4.4);
  car.add(inner);
  refs.exhausts.push(new THREE.Vector3(sx, 0.34, -4.4));
}

// ---- 尾翼 ----
car.add(box(0.12, 0.28, 0.35, carbonMat, 0.8, 1.42, -3.5));
car.add(box(0.12, 0.28, 0.35, carbonMat, -0.8, 1.42, -3.5));
car.add(box(3.1, 0.07, 0.65, carbonMat, 0, 1.58, -3.5));

// ---- 后视镜 ----
function mirror(sx) {
  const g = new THREE.Group();
  g.add(box(0.42, 0.06, 0.08, bodyMat, sx > 0 ? 0.18 : -0.18, 0, 0));
  g.add(box(0.3, 0.2, 0.14, bodyMat, sx > 0 ? 0.32 : -0.32, 0.03, 0));
  g.add(box(0.28, 0.18, 0.02, glassMat, sx > 0 ? 0.32 : -0.32, 0.03, sx > 0 ? 0.08 : -0.08));
  g.position.set(sx > 0 ? 1.98 : -1.98, 1.42, 1.55);
  car.add(g);
}
mirror(1);
mirror(-1);

// ---- 鲨鱼鳍天线 ----
car.add(box(0.04, 0.1, 0.3, darkMat, 0, 2.08, -1.9));

// ---- 门把手 ----
car.add(box(0.05, 0.06, 0.5, chromeMat, 1.97, 1.02, 0.3));
car.add(box(0.05, 0.06, 0.5, chromeMat, -1.97, 1.02, 0.3));

// ---- 轮拱 ----
for (const [sx, sz] of [[1.9, 2.5], [-1.9, 2.5], [1.9, -2.5], [-1.9, -2.5]]) {
  const arch = new THREE.Mesh(new THREE.TorusGeometry(0.85, 0.05, 8, 20, Math.PI), darkMat);
  arch.rotation.y = Math.PI / 2;
  arch.position.set(sx, 0.56, sz);
  car.add(arch);
}

// ---- 车牌 ----
function plate(z, yaw) {
  const c = document.createElement('canvas');
  c.width = 256; c.height = 64;
  const g = c.getContext('2d');
  g.fillStyle = '#f4f4f4'; g.fillRect(0, 0, 256, 64);
  g.strokeStyle = '#0a3d91'; g.lineWidth = 6; g.strokeRect(3, 3, 250, 58);
  g.fillStyle = '#0a3d91'; g.font = 'bold 42px Arial'; g.textAlign = 'center';
  g.fillText('3D·CAR', 128, 48);
  const tex = new THREE.CanvasTexture(c);
  const m = new THREE.Mesh(new THREE.BoxGeometry(1.05, 0.26, 0.02),
    new THREE.MeshStandardMaterial({ map: tex, roughness: 0.4, metalness: 0.1 }));
  m.position.set(0, 0.55, z);
  m.rotation.y = yaw;
  car.add(m);
}
plate(4.28, 0);
plate(-4.28, Math.PI);

// ================= 车轮（修复朝向：轮轴沿 X 轴） =================
const WHEEL_R = 0.77; // 轮胎外半径
const AXLE_W = 1.72;  // 左右轮距中心 X
const FRONT_Z = 2.5, REAR_Z = -2.5;

function buildWheel(isFront) {
  const wheel = new THREE.Group();

  // 转向节（仅前轮）
  const steer = new THREE.Group();
  const spin = new THREE.Group();
  steer.add(spin);
  wheel.add(steer);

  // 轮胎（圆环默认在 XY 平面，绕 Y 转 90° 使法线朝 X = 轮轴方向）
  const tire = new THREE.Mesh(new THREE.TorusGeometry(0.55, 0.22, 24, 40), tireMat);
  tire.rotation.y = Math.PI / 2;
  tire.castShadow = true;
  spin.add(tire);

  // 轮胎侧面凸起细节（胎壁）
  const sidewall = new THREE.Mesh(new THREE.CylinderGeometry(0.6, 0.6, 0.34, 32), tireMat);
  sidewall.rotation.z = Math.PI / 2;
  spin.add(sidewall);

  // 轮辋（圆柱默认轴沿 Y，绕 Z 转 90° 使轴沿 X）
  const rimDish = new THREE.Mesh(new THREE.CylinderGeometry(0.42, 0.42, 0.36, 32), rimMat);
  rimDish.rotation.z = Math.PI / 2;
  rimDish.castShadow = true;
  spin.add(rimDish);

  // 轮辋外圈
  const rimRing = new THREE.Mesh(new THREE.TorusGeometry(0.4, 0.035, 12, 32), rimMat);
  rimRing.rotation.y = Math.PI / 2;
  spin.add(rimRing);

  // 双五辐轮毂（在 YZ 平面辐射，绕 X 分布）
  for (let i = 0; i < 5; i++) {
    for (const [ang, len, thick] of [[i * Math.PI / 5, 0.74, 0.06], [i * Math.PI / 5 + Math.PI / 10, 0.62, 0.04]]) {
      const spoke = new THREE.Mesh(new THREE.BoxGeometry(0.055, len, thick), rimMat);
      spoke.rotation.x = ang;
      spoke.castShadow = true;
      spin.add(spoke);
    }
  }

  // 刹车盘（随车轮转动）
  const disc = new THREE.Mesh(new THREE.CylinderGeometry(0.26, 0.26, 0.04, 28), chromeMat);
  disc.rotation.z = Math.PI / 2;
  spin.add(disc);

  // 中心盖
  const hub = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.1, 0.4, 16), chromeMat);
  hub.rotation.z = Math.PI / 2;
  spin.add(hub);

  // 刹车卡钳（固定在转向节上，不随车轮转）
  const caliper = box(0.06, 0.22, 0.15, new THREE.MeshStandardMaterial({ color: 0xe63946, roughness: 0.4, metalness: 0.6 }), 0, 0.18, 0);
  steer.add(caliper);

  return { wheel, steer, spin };
}

const wheels = {};
for (const [key, sx, sz] of [['FL', -AXLE_W, FRONT_Z], ['FR', AXLE_W, FRONT_Z], ['RL', -AXLE_W, REAR_Z], ['RR', AXLE_W, REAR_Z]]) {
  const w = buildWheel(key[0] === 'F');
  w.wheel.position.set(sx, 0.56, sz);
  car.add(w.wheel);
  wheels[key] = w;
}
refs.steerL = wheels.FL.steer;
refs.steerR = wheels.FR.steer;

// ================= 车门（可开合） =================
function buildDoor(sx) {
  const pivot = new THREE.Group();
  pivot.position.set(sx, 1.15, 1.15);
  car.add(pivot);

  // 门板（绕前缘铰链，向车尾方向延伸）
  const panel = box(0.07, 0.72, 2.5, bodyMat, sx, 0, -1.15);
  pivot.add(panel);
  // 门上玻璃
  const win = box(0.04, 0.45, 1.5, glassMat, sx, 0.32, -0.5);
  pivot.add(win);
  // 门把手
  pivot.add(box(0.05, 0.06, 0.5, chromeMat, sx, -0.08, -1.3));
  // 门板装饰线
  pivot.add(box(0.03, 0.05, 2.0, darkMat, sx * 1.02, -0.12, -1.15));
  return pivot;
}
const doorL = buildDoor(-1.95);
const doorR = buildDoor(1.95);

scene.add(car);

// ================= 烟雾系统 =================
function makeSmokeTexture() {
  const c = document.createElement('canvas');
  c.width = c.height = 64;
  const g = c.getContext('2d');
  const grd = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  grd.addColorStop(0, 'rgba(210,210,210,0.9)');
  grd.addColorStop(0.5, 'rgba(180,180,180,0.45)');
  grd.addColorStop(1, 'rgba(150,150,150,0)');
  g.fillStyle = grd;
  g.fillRect(0, 0, 64, 64);
  return new THREE.CanvasTexture(c);
}

const smokeTex = makeSmokeTexture();
const particles = [];
for (let i = 0; i < 24; i++) {
  const mat = new THREE.SpriteMaterial({ map: smokeTex, transparent: true, opacity: 0, depthWrite: false });
  const sp = new THREE.Sprite(mat);
  sp.visible = false;
  scene.add(sp);
  particles.push({ sp, life: 0, maxLife: 1, vel: new THREE.Vector3(), scale0: 0.15, scale1: 1.6 });
}

const _wp = new THREE.Vector3();
const _fwd = new THREE.Vector3();
const _up = new THREE.Vector3(0, 1, 0);
let smokeTimer = 0;

function emitSmoke(dt, exhaustLocal) {
  smokeTimer -= dt;
  if (smokeTimer > 0) return;
  smokeTimer = 0.035;

  car.localToWorld(_wp.copy(exhaustLocal));
  car.getWorldDirection(_fwd); // 车头方向
  const back = _fwd.clone().negate();

  const p = particles.find(p => p.life <= 0);
  if (!p) return;
  p.life = 0.001;
  p.maxLife = 1.1 + Math.random() * 0.5;
  p.sp.position.copy(_wp);
  p.vel.copy(back).multiplyScalar(0.6 + Math.random() * 0.5);
  p.vel.y += 0.5 + Math.random() * 0.4;
  p.vel.x += (Math.random() - 0.5) * 0.3;
  p.vel.z += (Math.random() - 0.5) * 0.3;
  p.sp.visible = true;
  p.sp.material.opacity = 0.55;
  p.sp.scale.setScalar(p.scale0);
}

function updateSmoke(dt) {
  for (const p of particles) {
    if (p.life <= 0) continue;
    p.life += dt;
    if (p.life >= p.maxLife) {
      p.life = 0;
      p.sp.visible = false;
      continue;
    }
    const t = p.life / p.maxLife;
    p.vel.y += 0.8 * dt;
    p.sp.position.addScaledVector(p.vel, dt);
    p.sp.material.opacity = 0.55 * (1 - t);
    p.sp.scale.setScalar(p.scale0 + (p.scale1 - p.scale0) * t * t);
  }
}

// ================= 前照灯 =================
const spotL = new THREE.SpotLight(0xfff2d0, 0, 28, 0.5, 0.6, 1.5);
const spotR = new THREE.SpotLight(0xfff2d0, 0, 28, 0.5, 0.6, 1.5);
const targetL = new THREE.Object3D();
const targetR = new THREE.Object3D();
car.add(spotL, spotR, targetL, targetR);
spotL.position.set(-1.35, 1.0, 4.0);
spotR.position.set(1.35, 1.0, 4.0);
targetL.position.set(-1.35, -0.5, 16);
targetR.position.set(1.35, -0.5, 16);
spotL.target = targetL;
spotR.target = targetR;
spotL.castShadow = true;
spotR.castShadow = true;

// ================= 动画状态 =================
const clock = new THREE.Clock();
const R = 8;            // 绕圈半径
const driveSpeed = 0.45; // 角速度 rad/s
let theta = Math.PI / 2;
let driving = true;
let speed = 0;          // 当前速度(平滑)
let doorsOpen = false;
let doorTarget = 0;
let lightsOn = false;

window.setColor = (hex) => bodyMat.color.setHex(hex);

let spinCam = false;
window.toggleSpin = () => {
  spinCam = !spinCam;
  controls.autoRotate = spinCam;
  controls.autoRotateSpeed = 2;
};

window.toggleDrive = () => {
  driving = !driving;
  document.getElementById('btnDrive').textContent = driving ? '⏸ 停止行驶' : '▶ 开始行驶';
  document.getElementById('btnDrive').classList.toggle('active', driving);
};

window.toggleDoors = () => {
  doorsOpen = !doorsOpen;
  doorTarget = doorsOpen ? 1 : 0;
};

window.toggleLights = () => {
  lightsOn = !lightsOn;
  spotL.intensity = lightsOn ? 400 : 0;
  spotR.intensity = lightsOn ? 400 : 0;
};

// ================= 动画循环 =================
const tmpRoll = new THREE.Vector3();
function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;

  // 速度平滑
  const targetSpeed = driving ? driveSpeed : 0;
  speed += (targetSpeed - speed) * Math.min(1, dt * 3);
  theta += speed * dt;

  // 车身位置（绕圈）
  const ratio = speed / driveSpeed;
  car.position.set(R * Math.sin(theta), 0.03 * Math.sin(t * 16) * ratio, R * Math.cos(theta));
  car.rotation.y = theta + Math.PI / 2;   // 车头朝切线方向
  car.rotation.z = -0.07 * ratio;          // 转弯外侧倾
  car.rotation.x = 0.015 * Math.sin(t * 8) * ratio; // 轻微俯仰

  // 车轮滚动（轮轴沿 X，绕 X 转）
  const wheelSpin = speed * R / WHEEL_R;
  for (const k in wheels) {
    wheels[k].spin.rotation.x += wheelSpin * dt;
  }
  // 前轮转向（左转 = 绕 Y 负方向）
  const steerAngle = -0.42 * ratio;
  refs.steerL.rotation.y = steerAngle;
  refs.steerR.rotation.y = steerAngle;

  // 车门开合动画
  const openAngle = -1.15; // 左门向外
  doorL.rotation.y += (doorsOpen ? openAngle : 0 - doorL.rotation.y) * Math.min(1, dt * 5);
  doorR.rotation.y += (doorsOpen ? -openAngle : 0 - doorR.rotation.y) * Math.min(1, dt * 5);

  // 排气管烟雾（两侧交替）
  if (ratio > 0.3) {
    emitSmoke(dt, refs.exhausts[0]);
    emitSmoke(dt, refs.exhausts[1]);
  }
  updateSmoke(dt);

  controls.update();
  renderer.render(scene, camera);
}
animate();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
